name: Build Plezy Fire TV Test APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fire-tv-test-apk.yml
      - lib/screens/discover_screen.dart
      - lib/widgets/tv_spotlight_scaffold.dart
      - lib/widgets/tv_spotlight_background.dart

permissions:
  contents: read

jobs:
  build-fire-tv-apk:
    name: Android APK (TV test)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout Plezy fork
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter 3.47.1
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile --no-example

      - name: Use separate app ID for side-by-side test installation
        shell: bash
        run: |
          sed -i 's/applicationId = "com.edde746.plezy"/applicationId = "com.hecke92.plezytest"/' android/app/build.gradle.kts
          grep -F 'applicationId = "com.hecke92.plezytest"' android/app/build.gradle.kts
          sed -i 's/android:label="Plezy"/android:label="Plezy Test"/' android/app/src/main/AndroidManifest.xml

      - name: Build release APKs signed with Android debug key (testing only)
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=ENABLE_UPDATE_CHECK=false \
            --dart-define=ENABLE_SENTRY=false \
            --dart-define=ENABLE_DONATIONS=false

      - name: Upload installable APKs
        uses: actions/upload-artifact@v4
        with:
          name: Plezy-Fire-TV-Test-APKs
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          if-no-files-found: error
          retention-days: 30
